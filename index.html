<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ร้านน้ำเฉาก๊วย KKU - เฉาก๊วยสมุนไพรแท้ มหาวิทยาลัยขอนแก่น</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body class="bg-[#FAF7F2] text-[#2B1810] antialiased">
    <!-- Google Identity Services Global Handler -->
    <script>
      function parseJwt(token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      }

      function handleCredentialResponse(response) {
        // ถอดรหัส JWT Token ที่ได้จาก Google
        const responsePayload = parseJwt(response.credential);

        console.log("ID: " + responsePayload.sub);
        console.log('Full Name: ' + responsePayload.name);
        console.log('Given Name: ' + responsePayload.given_name);
        console.log('Family Name: ' + responsePayload.family_name);
        console.log("Image URL: " + responsePayload.picture);
        console.log("Email: " + responsePayload.email);

        // บันทึกข้อมูลลง LocalStorage เพื่อใช้งานในแอป
        const userData = {
          name: responsePayload.name,
          email: responsePayload.email,
          picture: responsePayload.picture
        };
        localStorage.setItem('user', JSON.stringify(userData));

        const appUserData = {
          id: responsePayload.sub,
          name: responsePayload.name,
          email: responsePayload.email,
          picture: responsePayload.picture,
          isLoggedIn: true,
          loginMethod: 'google'
        };
        localStorage.setItem('kku_chaokuay_google_user_v6', JSON.stringify(appUserData));

        // ส่ง CustomEvent ไปยัง React App เพื่ออัปเดต UI ทันทีโดยไม่ต้องรีโหลดหน้า
        window.dispatchEvent(new CustomEvent('google-user-login', { detail: appUserData }));
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
